services:
  - type: web
    name: voteyourway-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PIPELINE_ENABLED
        value: "false"
      - key: PYTHON_VERSION
        value: 3.11.9
